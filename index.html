<!DOCTYPE html>

<html>
    <head>
        <title>Vaja 3 - demo</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="js/libs/gl-matrix/gl-matrix.js"></script>
        <script src="js/gldemo.js"></script>
        <script id="simple-vs" type="x-shader/x-vertex">#version 300 es
            
            precision mediump float;

            uniform mat4 PVM;

            layout(location = 0) in vec3 VertexPosition;
            layout(location = 1) in vec3 VertexNormal;
            layout(location = 2) in vec2 VertexUV;

            uniform vec3 CubeColor;
            
            out vec3 vColor;
            out vec3 vNormal;
            out vec2 vUV;

            void main(){
                gl_Position=PVM * vec4(VertexPosition,1);
                vNormal = VertexNormal;
                vUV = VertexUV;
                vColor = CubeColor;
            }

        </script>
        <script id="simple-fs" type="x-shader/x-fragment">#version 300 es

            precision mediump float;

            uniform int ColorMode;
            in vec3 vNormal;
            in vec2 vUV;
            in vec3 vColor;

            out vec4 color;
            void main(){
                if (ColorMode == 0) {
                    color = vec4(vColor, 1.0);
                } else if (ColorMode == 1) {
                    color = vec4(vNormal, 1.0);
                } else if (ColorMode == 2) {
                    color = vec4(vUV, 0.0, 1.0);
                } else color = vec4(0.5, 0.5, 0.5, 1.0);
            } 
        </script>
    </head>
    <body>
        <div id="container" style="display: flex;" height="100%" gap="20px">
        <div id="containerDiv">
            <canvas id="myCanvas" width="600" height="600">Ni podpore za canvas?.</canvas>
        </div>   
        <div>
        <div style="padding:10px; border-bottom:1px solid #ccc; margin-bottom:10px;">
            <label>File upload (.obj): </label>
            <input type="file" id="uploadFile" accept=".obj" multiple><br>
            <label>Insert object: </label>
            <button id="insertObject">Insert</button>
        </div>
        <div style="padding:10px; border-bottom:1px solid #ccc; margin-bottom:10px;">
            <label>Projection: </label>
            <button id="toggleProjection">Perspective</button>
        </div>
        <div style="padding:10px; border-bottom:1px solid #ccc; margin-bottom:10px;">
            <label>Shear Animation: </label>
            <button id="toggleShearAnimation">Animate shear</button>
        </div>

        <div id="controls" style="width:300px; overflow-y:auto; padding:10px; border-left:1px solid #ccc; justify-content: flex-end;">
            <h3>Pyramid Controls</h3>
            
            <div>
                <label>Scale X: <span id="scaleXVal">1</span></label>
                <input type="range" id="scaleX" min="0.1" max="3" step="0.01" value="1">
            </div>
            <div>
                <label>Scale Y: <span id="scaleYVal">1</span></label>
                <input type="range" id="scaleY" min="0.1" max="3" step="0.01" value="1">
            </div>
            <div>
                <label>Scale Z: <span id="scaleZVal">1</span></label>
                <input type="range" id="scaleZ" min="0.1" max="3" step="0.01" value="1">
            </div>

            <div>
                <label>Rotation X: <span id="rotXVal">0</span></label>
                <input type="range" id="rotX" min="0" max="360" step="1" value="0">
            </div>
            <div>
                <label>Rotation Y: <span id="rotYVal">0</span></label>
                <input type="range" id="rotY" min="0" max="360" step="1" value="0">
            </div>
            <div>
                <label>Rotation Z: <span id="rotZVal">0</span></label>
                <input type="range" id="rotZ" min="0" max="360" step="1" value="0">
            </div>

            <div>
                <label>Position X: <span id="posXVal">0</span></label>
                <input type="range" id="posX" min="-5" max="5" step="0.01" value="0">
            </div>
            <div>
                <label>Position Y: <span id="posYVal">0</span></label>
                <input type="range" id="posY" min="-5" max="5" step="0.01" value="0">
            </div>
            <div>
                <label>Position Z: <span id="posZVal">0</span></label>
                <input type="range" id="posZ" min="-5" max="5" step="0.01" value="0">
            </div>

            <div>
                <label>Color mode: </label>
                <select id="colorMode">
                    <option value="normal">Normal</option>
                    <option value = "normala">Normala based</option>
                    <option value="uv">UV based</option>
                </select>
            </div>

            <div>
                <h3>Shear Controls</h3>
            </div>
            <div>
                <label>Theta: <span id="shearThetaVal">90</span></label>
                <input type="range" id="shearTheta" min="1" max="180" step="0.1" value="90">
            </div>
            <div>
                <label>Phi: <span id="shearPhiVal">90</span></label>
                <input type="range" id="shearPhi" min="1" max="180" step="0.1" value="90">
            </div>
            <div>
                <label for="shearType">Shear Type:</label>
                <select id="shearType">
                    <option value="XY">XY</option>
                    <option value="XZ">XZ</option>
                    <option value="YZ">YZ</option>
                </select>
            </div>
            <div>
                <label for="objectSelect">Select object:</label>
                <select id="objectSelect"></select>
            </div>
        </div>
    </body>
</html>
